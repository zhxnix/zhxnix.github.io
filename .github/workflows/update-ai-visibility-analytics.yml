name: Update AI Visibility analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-ai-visibility-analytics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch anonymous aggregate analytics
        env:
          ANALYTICS_API_TOKEN: ${{ secrets.ANALYTICS_API_TOKEN }}
        run: |
          response_file=$(mktemp)
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer ${ANALYTICS_API_TOKEN}" \
            -H "Accept: application/json" \
            -H "User-Agent: AI-Visibility-Analytics-Snapshot/1.0" \
            "https://ai-visibility-sprint.zhxnix.chatgpt.site/api/events?days=30" \
            --output "$response_file"
          node .github/scripts/normalize-analytics.mjs \
            "$response_file" \
            ai-visibility-analytics/data.json
      - name: Publish changed snapshot
        run: |
          git config user.name "analytics-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ai-visibility-analytics/data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update AI Visibility analytics snapshot"
          git push
